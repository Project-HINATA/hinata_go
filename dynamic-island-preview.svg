<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 1050" font-family="-apple-system, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', sans-serif">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#232641"/>
      <stop offset="0.55" stop-color="#31234a"/>
      <stop offset="1" stop-color="#1b2036"/>
    </linearGradient>
    <linearGradient id="wall2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2c48"/>
      <stop offset="1" stop-color="#171a2c"/>
    </linearGradient>
    <!-- 状态图标：计费中 = 蓝色时钟 -->
    <symbol id="ic-clock-fill-b" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10.4" fill="#0a84ff"/>
      <path d="M12 6.6 v5.6 l3.6 2.2" fill="none" stroke="#060609" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <!-- 待结账 = 橙色信用卡（icon 待定，此处选 creditcard.circle） -->
    <symbol id="ic-card-o" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10.4" fill="#ff9f0a"/>
      <rect x="5.4" y="8" width="13.2" height="8.4" rx="1.6" fill="#060609"/>
      <rect x="5.4" y="10.1" width="13.2" height="1.7" fill="#ff9f0a"/>
    </symbol>
    <!-- 暂停中 = 灰色暂停 -->
    <symbol id="ic-pause-gy" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10.4" fill="#98989f"/>
      <rect x="8.4" y="7.6" width="2.4" height="8.8" rx="1.1" fill="#060609"/>
      <rect x="13.2" y="7.6" width="2.4" height="8.8" rx="1.1" fill="#060609"/>
    </symbol>
    <!-- 结账成功 = 绿色对勾 -->
    <symbol id="ic-check-g" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="10.4" fill="#30d158"/>
      <path d="M7.4 12.4 l3.1 3.1 6.1 -6.6" fill="none" stroke="#060609" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <!-- 倒计时行小时钟 -->
    <symbol id="ic-clock-g" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" fill="none" stroke="#30d158" stroke-width="2.1"/>
      <path d="M12 7.2 v5 l3.3 2" fill="none" stroke="#30d158" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <symbol id="ic-clock-b" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" fill="none" stroke="#0a84ff" stroke-width="2.1"/>
      <path d="M12 7.2 v5 l3.3 2" fill="none" stroke="#0a84ff" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>

  <style>
    .mono { font-family: ui-monospace, 'SF Mono', Menlo, monospace; }
    .label { fill: #f5f5f7; }
    .dim { fill: #98989f; }
    .green { fill: #30d158; }
    .orange { fill: #ff9f0a; }
    .blue { fill: #0a84ff; }
    .gray { fill: #98989f; }
    .cap { fill: #85858e; font-size: 12.5px; }
    .island { fill: #060609; }
    .amt-sym { fill: #98989f; font-size: 12.5px; }
  </style>

  <rect x="0" y="0" width="1250" height="1050" fill="#0b0b10"/>
