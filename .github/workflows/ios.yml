name: iOS Build & App Store Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      channel:
        description: "Upload destination"
        required: true
        type: choice
        options:
          - beta
          - production
        default: beta

permissions:
  contents: read

concurrency:
  group: ios-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish iOS
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      IOS_BUNDLE_ID: moe.neri.hinatago
      IOS_ASC_KEY_ID: ${{ secrets.IOS_ASC_KEY_ID }}
      IOS_ASC_ISSUER_ID: ${{ secrets.IOS_ASC_ISSUER_ID }}
      IOS_ASC_KEY_P8_BASE64: ${{ secrets.IOS_ASC_KEY_P8_BASE64 }}
      IOS_SIGNING_P12_BASE64: ${{ secrets.IOS_SIGNING_P12_BASE64 }}
      IOS_SIGNING_P12_PASSWORD: ${{ secrets.IOS_SIGNING_P12_PASSWORD }}
      FASTLANE_SKIP_UPDATE_CHECK: "1"
      FASTLANE_HIDE_TIMESTAMP: "1"
      LOCAL_PLUGINS_REPO: ${{ secrets.LOCAL_PLUGINS_REPO }}
      LOCAL_PLUGINS_TOKEN: ${{ secrets.LOCAL_PLUGINS_TOKEN }}
      LOCAL_PLUGINS_REF: ${{ secrets.LOCAL_PLUGINS_REF }}
      CARDCIPHER_REPO: ${{ secrets.CARDCIPHER_REPO }}
      CARDCIPHER_TOKEN: ${{ secrets.CARDCIPHER_TOKEN }}
      CARDCIPHER_REF: ${{ secrets.CARDCIPHER_REF }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        shell: bash
        run: |
          set -euo pipefail
          # Flutter native asset hooks use the global selection as well.
          sudo xcode-select --switch "$DEVELOPER_DIR"
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          channel: "stable"
          cache: true

      - name: Import Apple signing identities
        shell: bash
        run: |
          set -euo pipefail
          test -n "$IOS_SIGNING_P12_BASE64"
          test -n "$IOS_SIGNING_P12_PASSWORD"

          keychain_path="$RUNNER_TEMP/hinata-signing-${GITHUB_RUN_ID}.keychain-db"
          p12_path="$RUNNER_TEMP/hinata-signing-${GITHUB_RUN_ID}.p12"
          keychain_password="$(openssl rand -base64 32)"
          printf '%s' "$IOS_SIGNING_P12_BASE64" | base64 --decode > "$p12_path"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$p12_path" \
            -k "$keychain_path" \
            -P "$IOS_SIGNING_P12_PASSWORD" \
            -A \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s \
            "$keychain_path" \
            "$HOME/Library/Keychains/login.keychain-db"
          security default-keychain -d user -s "$keychain_path"
          security find-identity -v -p codesigning "$keychain_path"

      - name: Check Apple build tools
        shell: bash
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          # Flutter native asset hooks strip DEVELOPER_DIR and use global Xcode selection.
          env -u DEVELOPER_DIR -u SDKROOT xcrun --show-sdk-path --sdk iphoneos
          xcodebuild -version
          flutter --version
          fastlane --version
          security find-identity -v -p codesigning

      - name: Setup private plugins
        if: ${{ env.LOCAL_PLUGINS_REPO != '' || env.CARDCIPHER_REPO != '' }}
        shell: bash
        run: ./.github/scripts/setup_private_plugins.sh

      - name: Select release channel
        id: channel
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_CHANNEL: ${{ inputs.channel }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # Keep the explicit destination override for manually started builds.
            case "${MANUAL_CHANNEL:-beta}" in
              beta|production) channel="${MANUAL_CHANNEL:-beta}" ;;
              *) echo "Unsupported iOS channel: $MANUAL_CHANNEL" >&2; exit 1 ;;
            esac
          else
            # Compare against the last stable tag reachable BEFORE this push.
            # Android may create the new version tag while this workflow runs,
            # so looking at HEAD (or the live release list) would race it.
            if [[ ! "$PUSH_BEFORE" =~ ^[0-9a-f]{40}$ || "$PUSH_BEFORE" == "0000000000000000000000000000000000000000" ]]; then
              echo "Missing previous push commit" >&2
              exit 1
            fi
            git cat-file -e "$PUSH_BEFORE^{commit}"
            version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml | head -1)"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Unsupported iOS version: $version" >&2
              exit 1
            fi
            stable_tag="$(git describe --first-parent --tags --abbrev=0 --match 'v[0-9]*' "$PUSH_BEFORE" 2>/dev/null || true)"
            if [[ -z "$stable_tag" ]]; then
              # First release, before any stable version has been tagged.
              channel=production
            elif [[ ! "$stable_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Unsupported stable tag: $stable_tag" >&2
              exit 1
            else
              IFS=. read -r major minor patch <<< "$version"
              IFS=. read -r old_major old_minor old_patch <<< "${stable_tag#v}"
              if (( 10#$major > 10#$old_major ||
                    (10#$major == 10#$old_major && 10#$minor > 10#$old_minor) ||
                    (10#$major == 10#$old_major && 10#$minor == 10#$old_minor && 10#$patch > 10#$old_patch) )); then
                channel=production
              elif (( 10#$major == 10#$old_major && 10#$minor == 10#$old_minor && 10#$patch == 10#$old_patch )); then
                channel=beta
              else
                echo "Project version $version is older than $stable_tag" >&2
                exit 1
              fi
            fi
            echo "iOS $channel: project $version, previous stable tag ${stable_tag:-none}"
          fi
          echo "value=$channel" >> "$GITHUB_OUTPUT"

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Calculate App Store build number
        id: version
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ steps.channel.outputs.value }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml | head -1)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported iOS version: $version" >&2
            exit 1
          fi
          marketing="$version"
          # TestFlight stays one patch ahead; production uses the project version.
          if [[ "$RELEASE_CHANNEL" == "beta" ]]; then
            marketing="${version%.*}.$((10#${version##*.} + 1))"
          fi
          echo "marketing=$marketing" >> "$GITHUB_OUTPUT"
          echo "Using App Store version $marketing for $RELEASE_CHANNEL"
          fastlane_output="$(mktemp)"
          if ! fastlane ios next_build_number 2>&1 | tee "$fastlane_output"; then
            cat "$fastlane_output" >&2
            exit 1
          fi
          build_number="$(sed -n 's/^NEXT_BUILD_NUMBER=//p' "$fastlane_output" | tail -1)"
          rm -f "$fastlane_output"
          test -n "$build_number"
          echo "build=$build_number" >> "$GITHUB_OUTPUT"

      - name: Build IPA
        shell: bash
        env:
          IOS_BUILD_NAME: ${{ steps.version.outputs.marketing }}
          IOS_BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: |
          bash .github/scripts/build_ios_ipa.sh

      - name: Publish IPA
        env:
          IOS_RELEASE_CHANNEL: ${{ steps.channel.outputs.value }}
          IOS_IPA_PATH: build/ios/ipa/*.ipa
        run: |
          set -euo pipefail
          ipa_path="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$ipa_path"
          publish_log="$(mktemp)"
          trap 'rm -f "$publish_log"' EXIT

          set +e
          IOS_IPA_PATH="$ipa_path" fastlane ios publish 2>&1 | tee "$publish_log"
          publish_status="${PIPESTATUS[0]}"
          set -e

          if [[ "$publish_status" -eq 0 ]]; then
            exit 0
          fi

          if grep -Fq "UPLOAD SUCCEEDED with no errors" "$publish_log"; then
            echo "::warning::Apple uploader completed successfully but reported a transient network error afterward."
            exit 0
          fi

          exit "$publish_status"

      - name: Remove temporary signing keychain
        if: ${{ always() }}
        shell: bash
        run: |
          keychain_path="$RUNNER_TEMP/hinata-signing-${GITHUB_RUN_ID}.keychain-db"
          p12_path="$RUNNER_TEMP/hinata-signing-${GITHUB_RUN_ID}.p12"
          security default-keychain -d user -s "$HOME/Library/Keychains/login.keychain-db" || true
          security list-keychains -d user -s "$HOME/Library/Keychains/login.keychain-db" || true
          security delete-keychain "$keychain_path" || true
          test ! -e "$p12_path" || unlink "$p12_path"
